
name: Build Hotel Maintenance Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q HotelMaintenancePro-Android-Project.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project/HotelMaintenancePro
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hotel-Maintenance-Pro-APK
          path: project/HotelMaintenancePro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
