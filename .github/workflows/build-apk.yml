
name: Build Hotel Maintenance Pro v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract PRO v3 project
        run: |
          ZIP_FILE="HotelMaintenancePro-PRO-v3.0-GitHub-APK-build.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "PRO v3 ZIP file not found"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          SETTINGS=$(find project -name settings.gradle -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Set unique PRO package ID
        run: |
          sed -i "s/applicationId 'com.hmp.hotelmaintenance'/applicationId 'com.hmp.hotelmaintenance.pro'/" "$PROJECT_DIR/app/build.gradle"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build PRO v3 APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload PRO v3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hotel-Maintenance-PRO-v3-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
